<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="在浏览器本地完成文本编码、解码、摘要与加密操作。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d241f'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-family='monospace' font-size='18' font-weight='700' fill='white'%3EE/D%3C/text%3E%3C/svg%3E">
  <title>Encode / Decode · 字符串工具箱</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <script type="module" src="scripts/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到工作区</a>
  <header class="app-header">
    <div class="brand" aria-label="Encode Decode 字符串工具箱">
      <span class="brand-mark" aria-hidden="true">E/D</span>
      <span><strong>Encode / Decode</strong><small>字符串工具箱</small></span>
    </div>
    <div class="header-controls">
      <label class="auto-control"><input id="autoConvert" type="checkbox"><span>自动转换</span></label>
      <label class="theme-control">
        <span>外观</span>
        <select id="themeSelect" aria-label="选择界面主题">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="算法导航">
      <div class="sidebar-heading"><p class="eyebrow">工具目录</p><h1>选择算法</h1></div>
      <label class="search-box">
        <span class="sr-only">搜索算法</span><span aria-hidden="true">⌕</span>
        <input id="algorithmSearch" type="search" autocomplete="off" placeholder="搜索算法或用途">
      </label>
      <nav id="algorithmNav" class="algorithm-nav" aria-label="算法列表"></nav>
      <p id="algorithmEmpty" class="empty-filter" hidden>没有匹配的算法</p>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <div class="mobile-picker">
        <label for="mobileAlgorithmSelect">当前工具</label>
        <select id="mobileAlgorithmSelect"></select>
      </div>

      <section class="tool-header" aria-labelledby="toolTitle">
        <div>
          <p id="toolCategory" class="eyebrow"></p>
          <h2 id="toolTitle"></h2>
          <p id="toolDescription" class="tool-description"></p>
        </div>
        <div id="toolBadges" class="badges" aria-label="算法特性"></div>
      </section>

      <section class="settings-card" aria-labelledby="settingsTitle">
        <div class="section-heading">
          <div><p class="step-label">01</p><h3 id="settingsTitle">转换设置</h3></div>
          <p id="settingsHint">按当前算法显示可用选项</p>
        </div>
        <div id="actionSwitcher" class="action-switcher" aria-label="操作方向"></div>
        <div id="configForm" class="config-grid"></div>
      </section>

      <section class="editor-card" aria-labelledby="inputTitle">
        <div class="section-heading editor-heading">
          <div><p class="step-label">02</p><h3 id="inputTitle">输入</h3></div>
          <div class="editor-meta"><span id="inputCount">0 字符</span></div>
        </div>
        <label class="sr-only" for="sourceText">待处理的输入内容</label>
        <textarea id="sourceText" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="在这里粘贴或输入内容…"></textarea>
        <div class="editor-toolbar">
          <button id="sampleButton" class="button button-ghost" type="button">填入示例</button>
          <button id="clearButton" class="button button-ghost danger-hover" type="button">清空</button>
          <span class="toolbar-spacer"></span><span class="shortcut-hint">⌘ / Ctrl + Enter</span>
          <button id="runButton" class="button button-primary" type="button"><span>开始转换</span><span aria-hidden="true">→</span></button>
        </div>
      </section>

      <section id="errorPanel" class="error-panel" role="alert" aria-live="assertive" hidden>
        <div class="error-icon" aria-hidden="true">!</div>
        <div class="error-content">
          <h3 id="errorTitle">转换失败</h3><p id="errorMessage"></p>
          <details><summary>查看技术详情</summary><pre id="errorDetails"></pre></details>
        </div>
        <button id="copyErrorButton" class="icon-button" type="button" aria-label="复制错误详情">复制</button>
      </section>

      <section class="editor-card result-card" aria-labelledby="outputTitle">
        <div class="section-heading editor-heading">
          <div><p class="step-label">03</p><h3 id="outputTitle">输出</h3></div>
          <div class="result-status">
            <span id="resultIndicator" class="status-dot" data-status="idle" aria-hidden="true"></span>
            <span id="resultStatus" aria-live="polite">等待转换</span><span id="resultTime"></span>
          </div>
        </div>
        <label class="sr-only" for="resultText">转换结果</label>
        <textarea id="resultText" readonly spellcheck="false" placeholder="转换结果会显示在这里"></textarea>
        <div class="editor-toolbar">
          <button id="swapButton" class="button button-ghost" type="button" hidden>交换输入输出</button>
          <span class="toolbar-spacer"></span>
          <button id="downloadButton" class="button button-ghost" type="button" disabled>下载</button>
          <button id="copyButton" class="button button-secondary" type="button" disabled>复制结果</button>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
